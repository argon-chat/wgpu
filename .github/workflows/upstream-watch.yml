# Watch the upstreams this repository tracks and file a tracking issue when one needs attention.
#
# The pins are deliberate: an upstream's C ABI, its shader front end and its set of unimplemented
# symbols all move between releases, so this repository never tracks "latest". This workflow exists
# so that "deliberate" does not quietly become "forgotten".
#
# ── Why one daily run rather than a cron per policy ─────────────────────────────────────────────
#
# The policies live in `upstream.manifest.ts`, and one of them is time-based: Dawn releases per
# commit with no semver, so it is adopted on a six-month cadence rather than chased by version.
#
# The obvious encoding would be a second, semiannual cron. It is the wrong one. A cron that fires
# twice a year has two failure modes with no middle ground: if that single run is broken, rate
# limited, or lands while the API is down, the next attempt is six months later — and nothing says
# so. Making the *policy* own the date and the *schedule* merely ask often turns a missed run into a
# one-day delay, and lets the window open on its own day instead of on a hardcoded 1 January.
#
# So: ask daily, answer by policy. `check:upstream` reports an event KIND — `major`, `minor`,
# `cadence-due`, `not-adopted` — and stays silent the rest of the time however many releases go past.

name: upstream-watch

on:
  schedule:
    # 06:10 UTC daily. Scheduled runs are queued, not punctual — GitHub delays them under load, and
    # a non-zero minute is conventional to avoid the top-of-hour crush.
    - cron: "10 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: upstream-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Report the state of every tracked upstream
        # Always runs, and prints the quiet ones too, so a green run reads as "these were checked"
        # rather than as "something printed nothing". Exit 10 means "an event" and is not a failure
        # here — the filing step below decides what to do about it.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun run check:upstream || [ $? -eq 10 ]

      - name: File a tracking issue per actionable event
        # Deduped on the issue title among OPEN issues, so a daily run cannot produce a daily issue.
        # A run that cannot determine the state exits non-zero and fails the workflow on purpose.
        env:
          # Lifts the anonymous API rate limit for the checker, and authenticates `gh` for filing.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun run upstream:issues
