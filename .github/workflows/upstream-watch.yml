# Watch gfx-rs/wgpu-native for a release newer than the tag we pin, and open an issue when there is
# one.
#
# The pin is deliberate: wgpu-native's C ABI, its WGSL front end and its set of unimplemented
# symbols all move between releases, so this repository never tracks "latest". This workflow exists
# so that "deliberate" does not quietly become "forgotten".
#
# Two design points worth keeping if this is ever edited:
#
#   * It must not open a new issue every morning. Before creating one it looks for an OPEN issue
#     whose title already names the same upstream tag, and does nothing if it finds one. The title
#     is therefore deterministic and load-bearing — do not make it prettier without updating the
#     search.
#
#   * A run that could not reach the API, or could not parse the manifest, FAILS. It does not report
#     "up to date". A watcher that cannot tell the difference between "nothing new" and "I am
#     broken" will sit silently broken for months, which is worse than not having one.

name: upstream-watch

on:
  schedule:
    # 06:10 UTC daily. Scheduled runs are queued, not punctual — GitHub delays them under load, and
    # a non-zero minute is conventional to avoid the top-of-hour crush.
    - cron: "10 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: upstream-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Compare the pinned tag with upstream
        id: check
        env:
          # Lifts the anonymous API rate limit; read-only, and the default token is enough.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          result="$(bun run scripts/check-upstream.ts --json)" || true
          echo "$result"

          ok="$(echo "$result" | jq -r '.ok // false')"
          if [ "$ok" != "true" ]; then
            echo "::error::upstream check could not determine the state: $(echo "$result" | jq -r '.error // "no output"')"
            echo "A watcher that cannot tell 'nothing new' from 'I am broken' is worse than none."
            exit 1
          fi

          {
            echo "behind=$(echo "$result" | jq -r '.behind')"
            echo "pinned=$(echo "$result" | jq -r '.pinned')"
            echo "latest=$(echo "$result" | jq -r '.latest')"
          } >> "$GITHUB_OUTPUT"

      - name: Open an issue if we are behind
        if: steps.check.outputs.behind == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PINNED: ${{ steps.check.outputs.pinned }}
          LATEST: ${{ steps.check.outputs.latest }}
        run: |
          set -euo pipefail
          TITLE="wgpu-native ${LATEST} is available (pinned: ${PINNED})"

          # Idempotence. Without this the workflow files one issue per day for the same release.
          existing="$(gh issue list --state open --search "in:title ${LATEST}" \
            --json number,title --jq ".[] | select(.title == \"${TITLE}\") | .number" | head -n1)"
          if [ -n "$existing" ]; then
            echo "Issue #${existing} already tracks ${LATEST} — nothing to do."
            exit 0
          fi

          # The label is convenience, not structure: the search above matches on title, so a missing
          # or manually deleted label can never cause a duplicate.
          gh label create upstream-update --color 0E8A16 \
            --description "A newer wgpu-native release is available" 2>/dev/null || true

          gh issue create \
            --title "$TITLE" \
            --label upstream-update \
            --body "$(cat <<EOF
          @0xf6 — upstream cut a release newer than the one this repository pins.

          | | |
          |---|---|
          | pinned | \`${PINNED}\` |
          | upstream | \`${LATEST}\` |
          | changes | https://github.com/gfx-rs/wgpu-native/compare/${PINNED}...${LATEST} |

          Bumping is **not** just editing the tag. A release can move the C ABI, the WGSL front end,
          and the set of exported-but-unimplemented symbols that abort when called — so the pin
          carries measured artefacts that have to be re-measured together:

          - [ ] \`bun run fetch --update-hashes\` — new URLs and sha256 for every platform
          - [ ] \`bun run gen:layouts\` — struct layouts are derived from the vendored headers, and the
                oracle compares them against a real C compiler; a bumped pin with stale generated
                layouts is exactly the silent-offset-shift this setup exists to prevent
            - [ ] \`bun test test/layout-oracle.test.ts\`
          - [ ] re-derive the abort-on-call symbol list and diff it — a release may add or, better,
                remove one; \`bun test test/abort-symbols.test.ts\`
          - [ ] confirm the upstream archive still ships no licence text, and that our vendored copy
                still matches the new tag
          - [ ] full suite on every platform the matrix covers

          Opened automatically by \`.github/workflows/upstream-watch.yml\`. It will not file a second
          issue for \`${LATEST}\` while this one is open; close it to acknowledge, or leave it open as
          the tracking issue for the bump.
          EOF
          )"
