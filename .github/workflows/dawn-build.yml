# Link Dawn's pinned static release, plus this repository's ABI shim, into the one shared library
# `bun:ffi` can load.
#
# The shim is **fused in**, not shipped beside: `bun:ffi` cannot express a C aggregate passed by
# value, and both directions of the WebGPU C API do it, so a Dawn install that carried only the API
# would still need a second file to be usable. One `cargo build` produces the same objects the
# standalone shim ships, and they are linked into this library — so a Dawn platform package is one
# binary, and the trampolines resolve Dawn's `wgpu*` from inside the module they live in.
#
# ── Why this is a workflow and not a local build step ───────────────────────────────────────────
#
# Two reasons, and the second is the important one.
#
# **Dawn ships static archives only.** Every release asset is `libwebgpu_dawn.a` / `webgpu_dawn.lib`,
# so there is nothing to `dlopen` until someone links it. See `dawn.manifest.ts`.
#
# **The result has to be auditable.** What eventually reaches npm is a binary this repository
# produced, not one upstream published, so "trust us" is the whole question. Building it in a public
# Actions run means the provenance attestation binds a commit here to those bytes, and the pinned
# input — tag, URL, sha256 in `dawn.manifest.ts` — means anyone can fetch the same archive and check
# it. Two pins, both verifiable, neither taken on faith.
#
# ── What each leg does, and why they are not the same job ──────────────────────────────────────
#
#   linux-x64     the compiler runs inside `dockcross/manylinux_2_28-x64`, which is the image Dawn's
#                 own CI builds in. Linking those objects on a bare runner produces a library that
#                 needs *that runner's* glibc and silently forfeits the 2.28 floor.
#                 Measured: 277 exported `wgpu*` symbols, 19.4 MiB, 65 s.
#   darwin-arm64  native, with **no** deployment-target override — the archive's objects declare
#                 their own minimum (26.0 in this release) and a number invented above them only
#                 produces "built for newer macOS version" on every object. See `dawn-link.ts`.
#   win32-x64     native, and the only leg that needs a generated `.def`: Dawn's `WGPU_EXPORT` is
#                 empty in a static configuration, so the objects carry no `dllexport` at all.
#                 It also needs the MSVC environment for `link` *and* `dumpbin` — both resolve to
#                 something else, or to nothing, on a bare `PATH`.
#
# ⚠ The Windows link needs an MSVC toolset no older than the one Dawn was built with. Measured
# locally: MSVC 14.50.35717 fails on `__std_min_element_4u` and two siblings — vectorised STL helpers
# whose unsigned variants it does not ship. Dawn's releases are built on `windows-latest`, so this
# job matching that image is not incidental, it is the mechanism. Pin the runner deliberately.
#
# ⚠ `linux-arm64` is absent because Google publishes no arm64 Linux desktop build. That platform
# needs a source build (~20 min on an arm64 runner), which is a different job and is not here yet.

# Each leg then **runs the whole test suite against what it just built**, with `WGPU_BUN_IMPL=dawn`.
# That is the part that makes the rest worth anything: exporting 292 symbols proves a link, not an
# implementation, and every difference between Dawn and wgpu-native found so far — three absent entry
# points, a consumed adapter, a by-value logging callback, a missing DXC — surfaced by running, never
# by reading.

name: dawn-build

on:
  push:
    paths: &dawn_paths
      - "dawn.manifest.ts"
      - "scripts/dawn-fetch.ts"
      - "scripts/dawn-link.ts"
      - "scripts/dawnHeaders.ts"
      - "scripts/exportFilters.ts"
      - "scripts/symbolTable.ts"
      # The shim is fused into the library this job produces, so its sources are inputs here too —
      # including the seam's `SHIM_EXPORTS`, which is the list the export filters are built from.
      - "scripts/shimBuild.ts"
      - "shim/**"
      # The binding itself, because this job now *runs* the suite against Dawn. A filter that fired
      # only on Dawn-specific files would let an ordinary change to `src/` break Dawn and stay
      # invisible until the next time someone edited something Dawn-shaped. The cost is a re-link on
      # most pushes — ~2 minutes per leg, in parallel — and that is the cheaper side of the trade.
      - "src/**"
      - "test/**"
      - ".github/workflows/dawn-build.yml"
  pull_request:
    paths: *dawn_paths
  workflow_dispatch:
  # Called by `release.yml`, so a release links Dawn with **this** recipe rather than a copy of it.
  # The alternative — duplicating the three legs there — is how the release build and the tested
  # build drift apart, and the drift is invisible until someone installs the published package.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: dawn-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  link:
    name: ${{ matrix.rid }}
    runs-on: ${{ matrix.runner }}
    # The archive is 111 MiB compressed and ~585 MiB expanded on Windows; the link itself takes
    # seconds. This bounds a stall, not the work.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            runner: ubuntu-latest
            # Dawn's own Linux release is built here. Matching it is what keeps the glibc floor.
            container: dockcross/manylinux_2_28-x64
          - rid: darwin-arm64
            runner: macos-15
            container: ""
          - rid: win32-x64
            # NOT `windows-latest`: this leg's correctness depends on the MSVC toolset being no older
            # than Dawn's, and Dawn builds on the `windows-latest` image. Tracking the same label is
            # deliberate — if the images diverge, the link fails loudly with named symbols.
            runner: windows-latest
            container: ""

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Fetch the pinned Dawn release
        # Pinned by URL + sha256; a mismatch hard-fails here rather than producing a library nobody
        # can trace back to an input.
        run: bun run dawn:fetch --rid ${{ matrix.rid }}

      - name: Link the shared library
        # The recipe lives in `scripts/dawn-link.ts`, including the container wrapping — one place
        # owns it, so the workflow and the script cannot drift apart about how the link is done.
        env:
          DAWN_LINK_CONTAINER: ${{ matrix.container }}
        run: bun run dawn:link --rid ${{ matrix.rid }}

      # ── proving it runs ───────────────────────────────────────────────────────────────────────
      #
      # Linking is not evidence. A library can export all 292 names and fail on the first call, and
      # everything below this line exists because that distinction has already cost this repository
      # several rounds. The suite that runs here is the *same* suite wgpu-native runs — not a smoke
      # test written to pass.

      - name: Fetch wgpu-native as well
        # Some suites assert facts about wgpu-native specifically (its export table, its
        # abort-symbol partition) and pin themselves to it regardless of WGPU_BUN_IMPL. Without the
        # library present they skip, and a Dawn leg that quietly ran two thirds of the corpus would
        # report a pass it did not earn.
        run: bun run fetch

      - name: Install a Vulkan driver
        if: matrix.rid == 'linux-x64'
        # lavapipe, the same CPU driver the main CI uses. Dawn on Linux has no other adapter here:
        # the runner has no GPU, and without this `requestAdapter()` returns null.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers libvulkan1

      # ⚠ There is deliberately **no step copying DXC or the Vulkan loader** on Windows. Dawn loads
      # both dynamically and finds neither through the standard search, but `src/dawnRuntime.ts`
      # preloads whatever the machine already has, by absolute path, before the instance is created —
      # so this leg exercises that resolution rather than papering over it with a copy. An earlier
      # revision did copy DXC out of the Windows SDK here, which made the job green while leaving the
      # runtime path that consumers take completely untested.

      - name: Run the suite against Dawn
        env:
          WGPU_BUN_IMPL: dawn
        # No `continue-on-error`, and no reduced selection. If Dawn cannot run this, the library this
        # job just built has no business being uploaded.
        run: bun test

      - name: Upload the library
        uses: actions/upload-artifact@v4
        with:
          name: webgpu-dawn-${{ matrix.rid }}
          # Exactly what a platform package needs, and nothing else. A `*webgpu_dawn*` glob would also
          # sweep up the generated `.def` and MSVC's `.exp`/import `.lib` — build inputs and
          # byproducts of no use to a consumer, which would then travel looking like product.
          #
          # ⚠ The paths start `vendor/*/` rather than `vendor/${{ matrix.rid }}/` **on purpose**. The
          # artefact root is the longest literal prefix before a wildcard, so this keeps the RID
          # directory inside the artefact; naming the RID literally would make the root
          # `vendor/<rid>` and a `merge-multiple: true` download in `release.yml` would then flatten
          # three platforms' libraries into one folder, two of them silently losing.
          path: |
            vendor/*/lib/webgpu_dawn.dll
            vendor/*/lib/libwebgpu_dawn.so
            vendor/*/lib/libwebgpu_dawn.dylib
            vendor/*/include-dawn/*
            vendor/*/.dawn-version
          if-no-files-found: error
